
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jogo Termo</title>
    <link rel="stylesheet" href="style.css">
    <script src="scripts.js"></script>
</head>
<body>

    <h1>TERMO</h1>
    <p>Descubra a palavra em até 6 tentativas!</p>

    <div id="tabuleiro"></div>

    <div class="entrada">
        <input type="text" id="palavra" placeholder="Digite uma palavra"
        maxlength="6">
        <button onclick="verificarPalavra()">Enviar</button>
    </div>

    <h3 id="mensagem"></h3>

    <button onclick="reiniciarJogo()">Novo Jogo</button>

    
</body>
</html>
